services:
  backend:
    image: ghcr.io/budum-tss/metacritic_dashboard-backend:latest
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sync/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/budum-tss/metacritic_dashboard-web:latest
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
