[project]
name = "metacritic-dashboard-backend"
version = "0.1.0"
description = "Backend of Metacritic Dashboard: parsers, scheduler, API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "APScheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
